services:
  card-sync:
    image: finance-card-sync:local
    build:
      context: ..
      dockerfile: sync-worker/Dockerfile
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - connections:/data
    shm_size: 512mb
    mem_limit: 1500m
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  connections:
